name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # I-01: the deploy is now gated. Before this, deploy.yml built and published
  # the frontend on every push to main and nothing ran the backend suite —
  # PRD R-1105 ("backend CI runs tests before deploy") was unmet.
  #
  # ci.yml is invoked as a reusable workflow rather than duplicated, so the
  # gate and the checks cannot drift apart.
  verify:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://imap-backend-mghb.onrender.com/api

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
